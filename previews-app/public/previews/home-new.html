<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Atliktos svetainės</title>
<link rel="stylesheet" href="player.css?v=5">
<style>
/* Two real GraspIT client sites in browser frames. Sizes are in container units so the whole composition scales as one picture. */
body{background:var(--stage)}
.comp{position:absolute;inset:0;overflow:hidden;container-type:size}
.fr{position:absolute;display:flex;flex-direction:column;background:#fff;border:1px solid var(--ink);border-radius:8px;overflow:hidden;box-shadow:0 2.6cqw 4.6cqw -2.4cqw rgba(16,55,43,.55)}
.fr .bar{height:26px}
.fr .bar .wm{position:static;margin:0 0 0 auto;flex:none;background:#fff;border:1px solid rgba(16,55,43,.16);height:18px;font-size:11px}
.fr .bar .wm img{width:14px;height:14px}
.shot{overflow:hidden;background:#fff}
.shot img{display:block;width:101.4%;height:auto;max-width:none}
.comp>.wm{position:absolute;z-index:6;right:4cqw;bottom:3.4cqw;top:auto;background:#fff;border:1px solid rgba(16,55,43,.16);height:22px;font-size:12px}
.fr.a{left:4cqw;top:5cqw;width:64cqw}
.fr.b{right:4cqw;top:22cqw;width:60cqw;z-index:2}
@container (max-aspect-ratio:1/1){
  .fr.a{left:5cqw;top:6cqw;width:78cqw}
  .fr.b{right:5cqw;top:48cqw;width:80cqw}
}
</style>
</head>
<body>
<div class="comp">
  <div class="fr a">
    <div class="bar"><i></i><i></i><i></i><div class="url">kalvita.lt</div></div>
    <div class="shot"><img src="/img/projects/kalvita.webp" alt="" width="1265" height="712"></div>
  </div>
  <div class="fr b">
    <div class="bar"><i></i><i></i><i></i><div class="url">colorlisse.lt</div></div>
    <div class="shot"><img src="/img/projects/colorlisse.webp" alt="" width="1265" height="712"></div>
  </div>
  <div class="wm"><img src="/img/logo-96.png" alt="" width="14" height="14"><span>GraspIT</span></div>
</div>
</body>
</html>
